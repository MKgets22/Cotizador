<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador</title>
</head>

<body>
    <div id="container">
        <img src="" alt="">
        <div id="coin-container">
            <form id="coin-form">
                <div class="coin-input-container">
                    <label for="coin">Elige tu moneda</label>
                    <select id="coin" class="coin-imput">
                        <option selected disabled value="">selecciona una moneda</option>
                        <option value="USD">Dolar</option>
                        <option value="EUR">EURO</option>
                        <option value="VES">Bolivares</option>
                        <option value="ARS">Persos Argentinos</option>
                    </select>
                </div>

                <div class="coin-input-container">
                    <label for="crypto">Elige tu Cryptomoneda</label>
                    <select id="coin" class="coin-imput">
                        <option selected disabled value="">selecciona una Criptomoneda</option>
                        <option value="BTC">Bitcoin</option>
                        <option value="ETH">Ethereum</option>
                        <option value="AXS">AXS</option>
                        <option value="BNC">Binance coin</option>
                    </select>
                </div>

                <div class="coin-input-container">
                    <label for="coin">Elige tu Criptomoneda</label>
                    <input type="text" class="coin-input" id="amount" placeholder="Monto">
                    </select>
                </div>
                <button id="form-btn" type="submit">Cotizar</button>
            </form>
            <div id="coin-info">
                <p class="info">El precio es <span class="price">1480</span></p>
                <p class="info">El precio mas alto es <span class="price">1480</span></p>
                <p class="info">El precio mas bajo es <span class="price">1480</span></p>
                <p class="info">variacion 24H<span class="price">4.5%</span></p>
                <p class="info">Puedes comprar <span class="price">1.5481 ETH</span></p>

            </div>
        </div>
    </div>
</body>

</html>
